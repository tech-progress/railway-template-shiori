services:
  shiori:
    build: .
    environment:
      PORT: "8080"
      SHIORI_DIR: /shiori
      SHIORI_HTTP_SECRET_KEY: ${SHIORI_HTTP_SECRET_KEY:-local-shiori-http-secret-key}
      SHIORI_USERNAME: ${SHIORI_USERNAME:-owner}
      SHIORI_PASSWORD: ${SHIORI_PASSWORD:?Set SHIORI_PASSWORD}
    volumes: ["shiori-data:/shiori"]
    ports: ["127.0.0.1:18080:8080"]
volumes:
  shiori-data:
